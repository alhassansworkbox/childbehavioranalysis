  <style>
/* ================= Aladdin Child Analysis — RTL theme ================= */
:root{
  --purple:#6F4BAE; --purple-dark:#573a8c; --pink:#F3B7D3; --pink-deep:#e78bb6;
  --bg:#FFF8FC; --white:#fff; --ink:#3a2c53; --muted:#8b7fa3;
  --good:#2fae7a; --good-bg:#e7f7ef; --warn:#e8912f; --warn-bg:#fdf1e2;
  --risk:#d9587f; --risk-bg:#fdeaf1; --rec:#5a6bd6; --rec-bg:#eef0fd;
  --shadow:0 10px 30px rgba(111,75,174,.12); --shadow-sm:0 4px 14px rgba(111,75,174,.10);
  --radius:22px; --radius-sm:15px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  background:
    radial-gradient(circle at 12% 8%, #fbe6f1 0, transparent 42%),
    radial-gradient(circle at 88% 4%, #efe7fb 0, transparent 40%),
    var(--bg);
  color:var(--ink); direction:rtl; line-height:1.7;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.brand-name,.score-num{font-family:"Baloo Bhaijaan 2","Tajawal",sans-serif;font-weight:700}

/* ---------- shell ---------- */
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.topbar{display:flex;align-items:center;gap:12px;justify-content:center;padding:14px 6px 6px;text-align:center}
.logo-badge{display:flex;align-items:center;justify-content:center}
.logo-img{width:104px;height:104px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:block}
.brand-name{color:var(--purple);font-size:1.05rem;line-height:1.3;margin:0}
.brand-sub{color:var(--pink-deep);font-size:.72rem;letter-spacing:.5px;margin:0;font-weight:700}

.hero-title{text-align:center;margin:6px 0 14px}
.hero-title h1{font-size:1.5rem;color:var(--purple);margin:.2em 0 .1em}
.hero-title p{margin:0;color:var(--muted);font-size:.92rem}

/* ---------- progress ---------- */
#progressWrap{position:sticky;top:8px;z-index:5;margin:8px 2px 18px}
.progress-track{height:12px;background:#f0e6f6;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(111,75,174,.12)}
#progressFill{height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  transition:width .5s cubic-bezier(.4,1.3,.5,1)}
#progressText{display:block;text-align:center;font-size:.78rem;color:var(--muted);margin-top:6px;font-weight:700}

/* ---------- cards ---------- */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:22px 20px;margin-bottom:16px;border:1px solid #f3ebf8}
.step-title{font-size:1.28rem;color:var(--purple);margin:.1em 0 .8em;text-align:center}
.fade-in{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* mascot */
.mascot-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.hi-bubble{background:var(--pink);color:var(--purple-dark);font-weight:700;font-size:.9rem;
  padding:8px 14px;border-radius:16px 16px 16px 4px}

/* ---------- form fields ---------- */
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-weight:700;color:var(--purple-dark);margin-bottom:8px;font-size:.98rem}
.fld input{width:100%;padding:14px 16px;border:2px solid #eadcf4;border-radius:var(--radius-sm);
  font-family:inherit;font-size:1.05rem;background:#fdfaff;color:var(--ink);transition:border .2s,box-shadow .2s}
.fld input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px rgba(111,75,174,.12)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{flex:1 1 auto;min-width:44%;padding:12px 10px;border:2px solid #eadcf4;background:#fdfaff;
  border-radius:14px;font-family:inherit;font-size:1rem;color:var(--ink);cursor:pointer;transition:.18s;font-weight:600}
.chip:hover{border-color:var(--pink-deep)}
.chip.sel{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:var(--shadow-sm)}

/* ---------- buttons ---------- */
.btn-primary{width:100%;padding:16px;border:none;border-radius:16px;cursor:pointer;
  background:linear-gradient(90deg,var(--purple),var(--pink-deep));color:#fff;
  font-family:inherit;font-weight:700;font-size:1.1rem;margin-top:6px;box-shadow:var(--shadow);transition:transform .15s,filter .15s}
.btn-primary:hover{filter:brightness(1.05)}
.btn-primary:active{transform:scale(.98)}
.btn-back{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.95rem;
  cursor:pointer;padding:2px 4px;margin-bottom:6px;font-weight:700}
.btn-back:hover{color:var(--purple)}
.btn-ghost{width:100%;padding:13px;border:2px solid #eadcf4;background:#fff;border-radius:14px;
  color:var(--purple);font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;margin-top:12px}
.reassure,.save-state{text-align:center;color:var(--muted);font-size:.8rem;margin:12px 0 0}
.err{background:var(--risk-bg);color:var(--risk);padding:10px 14px;border-radius:12px;
  font-weight:700;font-size:.9rem;margin:6px 0 0}

/* ---------- concern grid ---------- */
.concern-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.concern{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;
  border:2px solid #eadcf4;background:#fdfaff;border-radius:18px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:.98rem;transition:.18s}
.concern:hover{border-color:var(--pink-deep);transform:translateY(-2px)}
.concern.sel{background:linear-gradient(160deg,#fff,#f7edfb);border-color:var(--purple);box-shadow:var(--shadow-sm)}
.concern .ce{font-size:1.9rem;line-height:1}
.concern:last-child:nth-child(odd){grid-column:1 / -1}

/* ---------- questions ---------- */
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-cat{background:var(--pink);color:var(--purple-dark);font-weight:700;font-size:.78rem;padding:5px 12px;border-radius:999px}
.q-num{color:var(--muted);font-size:.82rem;font-weight:700}
.q-text{font-size:1.3rem;color:var(--purple);margin:.1em 0 .9em;line-height:1.5}
.answers{display:flex;flex-direction:column;gap:11px}
.answer{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;text-align:right;
  border:2px solid #eadcf4;background:#fdfaff;border-radius:16px;cursor:pointer;
  font-family:inherit;font-size:1.08rem;color:var(--ink);font-weight:600;transition:.16s}
.answer .dot{width:20px;height:20px;border-radius:50%;border:2px solid #d9c6ea;flex:0 0 auto;transition:.16s}
.answer:hover{border-color:var(--pink-deep);transform:translateX(-3px)}
.answer.sel{background:var(--purple);border-color:var(--purple);color:#fff}
.answer.sel .dot{background:#fff;border-color:#fff;box-shadow:inset 0 0 0 4px var(--purple)}

/* ---------- result ---------- */
.result{animation:fade .5s ease}
.result-hero{border-radius:26px;padding:26px 20px;text-align:center;color:#fff;margin-bottom:16px;box-shadow:var(--shadow)}
.result-hero.t-good{background:linear-gradient(160deg,#34b98a,#2fae7a)}
.result-hero.t-mid{background:linear-gradient(160deg,#eaa93f,#e8912f)}
.result-hero.t-low{background:linear-gradient(160deg,#8a5cc0,#6F4BAE)}
.result-hero h2{margin:14px 0 6px;font-size:1.3rem}
.status-desc{margin:0;opacity:.95;font-size:.96rem}
.score-ring{width:118px;height:118px;border-radius:50%;margin:0 auto 10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.16);
  border:5px solid rgba(255,255,255,.55);animation:pop .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.score-num{font-size:2.5rem;line-height:1}
.score-den{font-size:.9rem;opacity:.85}
.status-badge{display:inline-block;background:rgba(255,255,255,.2);padding:6px 18px;border-radius:999px;font-weight:700;margin-top:4px}

.sec-title{color:var(--purple);font-size:1.12rem;margin:0 0 12px}
.bar-row{margin-bottom:14px}
.bar-top{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:6px;color:var(--purple-dark)}
.bar-track{height:14px;background:#f0e6f6;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transition:width .9s cubic-bezier(.4,1.2,.5,1)}
.bar-fill.t-good{background:linear-gradient(90deg,#7ad0aa,var(--good))}
.bar-fill.t-mid{background:linear-gradient(90deg,#f2c67e,var(--warn))}
.bar-fill.t-low{background:linear-gradient(90deg,var(--pink),var(--purple))}

.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.rlist li{padding:12px 14px;border-radius:13px;font-weight:600;font-size:.98rem;border-inline-start:5px solid}
.rlist.good li{background:var(--good-bg);border-color:var(--good)}
.rlist.warn li{background:var(--warn-bg);border-color:var(--warn)}
.rlist.risk li{background:var(--risk-bg);border-color:var(--risk)}
.rlist.rec li{background:var(--rec-bg);border-color:var(--rec)}
.muted{color:var(--muted)}

.card.focus{background:linear-gradient(160deg,#fff,#f7edfb);border:2px solid var(--purple)}
.focus-main{font-size:1.15rem;font-weight:700;color:var(--purple);margin:0 0 6px}
.focus-rec{margin:0;color:var(--ink)}

.plan{display:flex;flex-direction:column;gap:12px}
.plan-col{background:#fdfaff;border:2px solid #f0e6f6;border-radius:16px;padding:14px 16px}
.plan-col h4{margin:0 0 8px;color:var(--pink-deep);font-size:1rem}
.plan-col p{margin:5px 0;font-size:.96rem}

.card.tip{background:#fff9f2;border:2px solid #f6e2c8}
.card.message{background:linear-gradient(160deg,#f7edfb,#fdeaf1);border:none;text-align:center;font-size:1.05rem;font-weight:600;color:var(--purple-dark)}

/* ---------- CTA ---------- */
.cta{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;text-align:center;border:1px solid #f3ebf8}
.cta>p{margin:0 0 14px;font-weight:600}
.btn-whatsapp{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:16px;border-radius:16px;background:#25D366;color:#fff;text-decoration:none;
  font-weight:700;font-size:1.12rem;box-shadow:0 8px 20px rgba(37,211,102,.35);transition:transform .15s,filter .15s}
.btn-whatsapp:hover{filter:brightness(1.04)}
.btn-whatsapp:active{transform:scale(.98)}
.save-state.ok{color:var(--good)}.save-state.bad{color:var(--warn)}

/* ---------- footer ---------- */
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:22px;line-height:2}
.foot a{color:var(--purple);text-decoration:none;font-weight:700}

/* ---------- desktop niceties ---------- */
@media(min-width:600px){
  .plan{flex-direction:row}
  .plan-col{flex:1}
  .hero-title h1{font-size:1.8rem}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:8px}

</style>

      <div class="progress-track"><div id="progressFill"></div></div>

    <footer class="foot">
      عيادة علاء الدين — البصرة، الطويسة، شارع اللجنة الأولمبية<br />

  <script>
/* ============================================================
   تحليل صحة وسلوك طفلك — Aladdin Pediatric Dental Clinic
   Wizard + scoring engine + personalized report engine.
   All content is generated from the child's actual answers.
   ============================================================ */

'use strict';

/* ---------- clinic config (WhatsApp comes from the server) ---------- */
const CONFIG = { whatsapp: '9647861111304' };
fetch('/api/config').then(r => r.json()).then(c => { if (c.whatsapp) CONFIG.whatsapp = c.whatsapp; }).catch(() => {});

/* ---------- step 1 + step 2 data ---------- */
const AGE_OPTIONS = ['أقل من 3 سنوات', '3-5 سنوات', '6-8 سنوات', '9-12 سنة'];
const GENDER_OPTIONS = ['ولد', 'بنت'];
const CONCERNS = [
  { t: 'تسوس الأسنان', e: '🦷' },
  { t: 'الخوف من طبيب الأسنان', e: '😰' },
  { t: 'كثرة الحلويات', e: '🍭' },
  { t: 'التغذية', e: '🥗' },
  { t: 'استخدام الموبايل', e: '📱' },
  { t: 'النوم', e: '😴' },
  { t: 'شي ثاني', e: '💬' },
];

/* ---------- the 12 assessment questions ----------
   cat: oral | nutrition | activity | habits
   options are listed in display order; p = points (question max = 10)
   weakMax: answer counts as a weakness when points <= weakMax
   strongMin: answer counts as a strength when points >= strongMin
   priority: higher = more urgent when choosing the single top focus
   horizon: where its action lands in the plan (week | next | month)
------------------------------------------------------------------ */
const QUESTIONS = [
  {
    id: 1, cat: 'oral', text: 'شكد مرة ينظف الطفل أسنانه باليوم؟',
    options: [
      { t: 'ما ينظفها', p: 0 }, { t: 'مرة وحدة', p: 5 },
      { t: 'مرتين', p: 10 }, { t: 'أكثر من مرتين', p: 8 },
    ],
    weakMax: 5, strongMin: 8, priority: 7, horizon: 'week',
    weakness: 'تنظيف الأسنان غير منتظم',
    strength: 'يتم تنظيف الأسنان بشكل منتظم',
    risk: '🦷 زيادة احتمالية التسوس وتراكم الجير',
    rec: 'ثبّتوا روتين تفريش مرتين يومياً — الصبح وقبل النوم — بمعجون يحتوي فلورايد بكمية مناسبة لعمر الطفل.',
    plan: 'ابدأوا روتين تفريش ثابت مرتين باليوم (صبح + قبل النوم).',
  },
  {
    id: 2, cat: 'oral', text: 'من ينظف أسنانه، أحد من الأهل يتابعه؟',
    options: [
      { t: 'ما نتابعه', p: 0 }, { t: 'أحياناً', p: 4 },
      { t: 'أغلب الأيام', p: 7 }, { t: 'دائماً', p: 10 },
    ],
    weakMax: 4, strongMin: 7, priority: 5, horizon: 'week',
    weakness: 'قلة الإشراف على تنظيف الأسنان',
    strength: 'متابعة جيدة من الأهل لتنظيف الأسنان',
    risk: '🦷 تفريش غير فعّال وبقاء بقايا الطعام بين الأسنان',
    rec: 'أشرفوا على تفريش الطفل حتى عمر 7–8 سنوات وتأكدوا من وصول الفرشاة لكل الأسنان.',
    plan: 'راقبوا تفريش الطفل يومياً وساعدوه للأماكن الخلفية.',
  },
  {
    id: 3, cat: 'oral', text: 'آخر مرة فحصتوا أسنان الطفل؟',
    options: [
      { t: 'خلال آخر 6 أشهر', p: 10 }, { t: 'خلال آخر سنة', p: 6 },
      { t: 'أكثر من سنة', p: 2 }, { t: 'ما فحصناه أبداً', p: 0 },
    ],
    weakMax: 2, strongMin: 6, priority: 8, horizon: 'month',
    weakness: 'تأخر زيارة طبيب الأسنان',
    strength: 'التزام جيد بالفحص الدوري',
    risk: '🦷 اكتشاف متأخر للتسوس ومشاكل ممكن تكبر بدون متابعة',
    rec: 'احجزوا فحص دوري كل 6 أشهر حتى لو ما في ألم؛ الكشف المبكر يوفّر علاجات أكبر لاحقاً.',
    plan: 'احجزوا موعد فحص دوري بعيادة علاء الدين خلال هذا الشهر.',
  },
  {
    id: 4, cat: 'oral', text: 'الطفل يشتكي من ألم أو حساسية بالأسنان؟',
    options: [
      { t: 'هواي', p: 0 }, { t: 'أحياناً', p: 4 },
      { t: 'نادراً', p: 7 }, { t: 'أبداً', p: 10 },
    ],
    weakMax: 4, strongMin: 7, priority: 10, horizon: 'week',
    weakness: 'ألم أو حساسية متكررة بالأسنان',
    strength: 'لا يعاني من ألم أو حساسية بالأسنان',
    risk: '🦷 احتمال وجود تسوس نشط أو مشكلة تحتاج علاج قريب',
    rec: 'ألم الأسنان المتكرر عند الأطفال يحتاج فحص عاجل لتحديد السبب قبل ما يكبر.',
    plan: 'احجزوا موعد فحص هذا الأسبوع لتقييم سبب الألم.',
  },
  {
    id: 5, cat: 'nutrition', text: 'باليوم شكد مرة ياكل حلويات؟',
    options: [
      { t: 'أكثر من 3 مرات', p: 0 }, { t: 'مرتين أو 3', p: 4 },
      { t: 'مرة وحدة', p: 7 }, { t: 'نادراً', p: 10 },
    ],
    weakMax: 4, strongMin: 7, priority: 6, horizon: 'next',
    weakness: 'كثرة الحلويات',
    strength: 'استهلاك الحلويات ضمن حدود جيدة',
    risk: '🍭 اعتماد مفرط على السكريات وزيادة خطر التسوس',
    rec: 'قلّلوا الحلويات واحصروها بوقت واحد بعد الوجبة بدل توزيعها طول اليوم، وبدّلوها بفواكه أو زبادي.',
    plan: 'قلّلوا الحلويات لمرة وحدة باليوم بعد الأكل مو بين الوجبات.',
  },
  {
    id: 6, cat: 'nutrition', text: 'يشرب عصائر أو مشروبات غازية؟',
    options: [
      { t: 'يومياً', p: 0 }, { t: 'كم مرة بالأسبوع', p: 4 },
      { t: 'مرة بالأسبوع', p: 7 }, { t: 'نادراً', p: 10 },
    ],
    weakMax: 4, strongMin: 7, priority: 5, horizon: 'next',
    weakness: 'كثرة العصائر والمشروبات الغازية',
    strength: 'استهلاك منخفض للمشروبات السكرية',
    risk: '🥤 زيادة حموضة الفم وتآكل طبقة المينا',
    rec: 'استبدلوا المشروبات الغازية والعصائر الجاهزة بالماء؛ وإذا شرب عصير خلّوه طبيعي وبكوب واحد مع الوجبة.',
    plan: 'بدّلوا العصير والغازي بالماء، وخلّوا العصير الطبيعي مع الوجبة فقط.',
  },
  {
    id: 7, cat: 'nutrition', text: 'يشرب مي بشكل كافي؟',
    options: [
      { t: 'لا', p: 0 }, { t: 'مو دائماً', p: 4 },
      { t: 'غالباً', p: 7 }, { t: 'نعم', p: 10 },
    ],

const CAT_LABEL = { oral: 'صحة الفم والأسنان', nutrition: 'التغذية', activity: 'النشاط', habits: 'العادات اليومية' };

const CONCERN_TIP = {
  'الخوف من طبيب الأسنان': 'بما إن الخوف من الطبيب هو أكثر شي يقلقكم: احجزوا زيارة تعريفية قصيرة وبدون علاج أول مرة، واستخدموا كلمات إيجابية عن طبيب الأسنان بالبيت. بعيادة علاء الدين نتعامل مع خوف الأطفال بأسلوب لعب وتدرّج.',
  'النوم': 'بما إن النوم يهمّكم: ثبّتوا وقت نوم منتظم وابعدوا الشاشات قبل النوم بساعة، وخلّوا آخر خطوة قبل النوم تفريش الأسنان.',
  'استخدام الموبايل': 'بما إن استخدام الموبايل يقلقكم: اتفقوا على وقت شاشة ثابت يومياً وبدّلوا جزء منه بنشاط أو لعبة عائلية.',
};

/* ============================================================
   SCORING
   ============================================================ */
function scoreAssessment(answers) {
  const sub = { oral: 0, nutrition: 0, activity: 0, habits: 0 };
  QUESTIONS.forEach((q, i) => {
    const pts = q.options[answers[i]]?.p ?? 0;
    sub[q.cat] += pts;
  });
  const total = sub.oral + sub.nutrition + sub.activity + sub.habits;
  return { sub, total };
}

function classify(total) {
  if (total >= 90) return { key: 'hero', label: 'بطل صحة', emoji: '🟢', tone: 'good',
    desc: 'طفلك يمتلك عادات صحية ممتازة مقارنة بعمره.' };
  if (total >= 60) return { key: 'track', label: 'على الطريق الصحيح', emoji: '🟡', tone: 'mid',
    desc: 'طفلك يمتلك أساس جيد لكن توجد بعض الأمور التي تحتاج تحسين.' };
  return { key: 'attention', label: 'يحتاج اهتمام أكثر', emoji: '🔴', tone: 'low',
    desc: 'هناك عدة عادات قد تؤثر على صحة الطفل مستقبلاً وتحتاج إلى متابعة.' };
}

/* ============================================================
   PERSONALIZED REPORT ENGINE  (built only from real answers)
   ============================================================ */
function buildReport(state) {
  const { answers, childName, mainConcern } = state;
  const { sub, total } = scoreAssessment(answers);
  const status = classify(total);

  const strengths = [];
  const weaknesses = []; // {q, points}
  QUESTIONS.forEach((q, i) => {
    const pts = q.options[answers[i]].p;
    if (pts >= q.strongMin) strengths.push(q.strength);
    if (pts <= q.weakMax) weaknesses.push({ q, pts });
  });

  // order weaknesses by urgency, then by how low the answer scored
  weaknesses.sort((a, b) => (b.q.priority - a.q.priority) || (a.pts - b.pts));

  const risks = weaknesses.map((w) => w.q.risk);
  const recommendations = weaknesses.map((w) => w.q.rec);

  // single highest-priority focus
  const topFocus = weaknesses.length ? weaknesses[0].q : null;

  // improvement plan by horizon
  const plan = { week: [], next: [], month: [] };
  weaknesses.forEach((w) => plan[w.q.horizon].push(w.q.plan));
  // always nudge a checkup into the month plan (lead-gen + clinically sound)
  const hasVisitItem = weaknesses.some((w) => w.q.id === 3 || w.q.id === 4);
  if (!hasVisitItem) plan.month.push('احجزوا فحص دوري كل 6 أشهر للحفاظ على أسنان الطفل.');
  // gentle fillers so no timeframe is empty
  if (!plan.week.length) plan.week.push('استمروا بالتفريش مرتين يومياً والماء بدل المشروبات السكرية.');
  if (!plan.next.length) plan.next.push('حافظوا على التوازن بين وقت الشاشة واللعب الحركي.');
  if (!plan.month.length) plan.month.push('راقبوا أي تغيّر بالأسنان وواصلوا الفحص الدوري.');

  // warm Iraqi-Arabic message tuned to the result
  let message;
  if (status.key === 'hero') {
    message = `ماشاء الله على ${childName}! الإجابات تبيّن إن عنده عادات صحية ممتازة. استمروا بنفس الروتين، وخلّوا الفحص الدوري كل ٦ أشهر عادة ثابتة حتى تبقى ابتسامته قوية.`;
  } else if (status.key === 'track') {
    message = `من خلال الإجابات واضح إن ${childName} عنده نقاط إيجابية جيدة، وأكو بعض الأمور البسيطة إذا ركزتوا عليها بالفترة الجاية راح تساعده يحافظ على صحة أفضل وأسنان أقوى بالمستقبل.`;
  } else {
    message = `لا تقلقون — النتيجة مو تقييم للأهل، بس تنبيه مفيد. أكو كم عادة عند ${childName} تحتاج انتباه، وأغلبها أشياء بسيطة تنعالج بسهولة إذا بدأتوا بيها من هسه. واحنا بعيادة علاء الدين جاهزين نساعدكم خطوة بخطوة.`;
  }

  const concernTip = CONCERN_TIP[mainConcern] || null;

  // plain-text version stored in Notion "Generated Report"
  const reportText = [
    `تقرير صحة الطفل ${childName}`,
    `الدرجة النهائية: ${total} / 120 — ${status.label}`,
    `صحة الفم ${sub.oral}/50 · التغذية ${sub.nutrition}/30 · النشاط ${sub.activity}/20 · العادات ${sub.habits}/20`,
    '',
    'نقاط القوة: ' + (strengths.length ? strengths.join(' | ') : 'لا يوجد بارز'),
    'أمور تحتاج اهتمام: ' + (weaknesses.length ? weaknesses.map((w) => w.q.weakness).join(' | ') : 'لا يوجد'),
    topFocus ? `أهم نقطة حالياً: ${topFocus.weakness}` : '',
    concernTip ? `ملاحظة حول القلق الأساسي (${mainConcern}).` : '',
  ].filter(Boolean).join('\n');

  return {
    sub, total, status,
    strengths,
    weaknesses: weaknesses.map((w) => w.q.weakness),
    risks,
    recommendations,
    topFocus: topFocus ? { weakness: topFocus.weakness, rec: topFocus.rec } : null,
    plan, message, concernTip,
    reportText,
    riskFactorsText: risks.join(' | '),
    recommendationsText: recommendations.join(' | '),
  };
}

/* ============================================================
   WIZARD STATE + FLOW
   ============================================================ */
const state = {
  childName: '', parentPhone: '', childAge: '', childGender: '',
  mainConcern: '', answers: new Array(QUESTIONS.length).fill(null),
  step: 0, // 0 = info, 1 = concern, 2..13 = questions, 14 = result
};
const TOTAL_STEPS = 2 + QUESTIONS.length; // info + concern + 12 questions

const app = document.getElementById('app');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');

function setProgress() {
  const done = Math.min(state.step, TOTAL_STEPS);
  const pct = Math.round((done / TOTAL_STEPS) * 100);
  progressFill.style.width = pct + '%';
  progressText.textContent = state.step >= TOTAL_STEPS ? 'اكتمل التحليل' : `الخطوة ${done + 1} من ${TOTAL_STEPS}`;
  document.getElementById('progressWrap').style.visibility = state.step >= TOTAL_STEPS ? 'hidden' : 'visible';
}

function transition(html) {
  app.classList.remove('fade-in');
  void app.offsetWidth; // reflow to restart animation
  app.innerHTML = html;
  app.classList.add('fade-in');
  app.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- render: a single question ---------- */
function renderQuestion() {
  const qi = state.step - 2;
  const q = QUESTIONS[qi];
  const chosen = state.answers[qi];
  transition(`
    <div class="card">
      <button class="btn-back" id="back">→ رجوع</button>
      <div class="q-meta"><span class="q-cat">${CAT_LABEL[q.cat]}</span><span class="q-num">سؤال ${qi + 1} / ${QUESTIONS.length}</span></div>
      <h2 class="q-text">${q.text}</h2>
      <div class="answers" id="answers">
        ${q.options.map((o, idx) => `
          <button class="answer ${chosen === idx ? 'sel' : ''}" data-idx="${idx}">
            <span class="dot"></span><span>${o.t}</span>
          </button>`).join('')}
      </div>
    </div>`);

  document.getElementById('back').onclick = () => { state.step -= 1; render(); };
  document.querySelectorAll('#answers .answer').forEach(btn => {
    btn.onclick = () => {
      state.answers[qi] = Number(btn.dataset.idx);
      document.querySelectorAll('#answers .answer').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      setTimeout(() => {
        if (state.step < TOTAL_STEPS - 1) { state.step += 1; render(); }
        else { state.step = TOTAL_STEPS; render(); }
      }, 240);
    };
  });
}

          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.8 4.9-1.3A10 10 0 1 0 12 2zm5.7 14.1c-.24.67-1.4 1.3-1.94 1.35-.5.05-1.13.07-1.82-.11-.42-.11-.96-.31-1.66-.6-2.9-1.25-4.8-4.17-4.95-4.37-.14-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.26-.29.57-.36.76-.36l.55.01c.18.01.42-.07.65.5.24.58.82 2 .89 2.14.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.16-.29.36-.42.48-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.93 1.94 1.22 2.22 1.36.28.14.44.12.6-.07.16-.19.69-.8.87-1.08.18-.28.36-.23.6-.14.24.09 1.55.73 1.82.86.28.14.46.21.53.32.07.12.07.67-.17 1.34z"/></svg>
          تواصلوا عبر الواتساب
        </a>
        <button class="btn-ghost" id="restart">تحليل طفل ثاني</button>
        <p class="save-state" id="saveState">… يتم حفظ النتيجة</p>
      </div>
    </div>`);

  // animate bars
  requestAnimationFrame(() => setTimeout(() => {
    document.querySelectorAll('.bar-fill').forEach(el => { el.style.width = el.dataset.pct + '%'; });
  }, 120));

  document.getElementById('restart').onclick = () => {
    Object.assign(state, {
      childName: '', parentPhone: '', childAge: '', childGender: '', mainConcern: '',
      answers: new Array(QUESTIONS.length).fill(null), step: 0,
    });
    render();
  };

  submitToNotion(r);
}

/* ---------- submit ---------- */
function submitToNotion(r) {
  const el = document.getElementById('saveState');
  fetch('/api/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      childName: state.childName,
      parentPhone: state.parentPhone,
      childAge: state.childAge,
      childGender: state.childGender,
      mainConcern: state.mainConcern,
      oralScore: r.sub.oral, nutritionScore: r.sub.nutrition,
      activityScore: r.sub.activity, habitsScore: r.sub.habits,
      totalScore: r.total, healthStatus: r.status.label,
      riskFactors: r.riskFactorsText,
      recommendations: r.recommendationsText,
      generatedReport: r.reportText,
    }),
  })
    .then(res => res.json())
    .then(d => { if (el) { el.textContent = d.ok ? '✔ تم حفظ النتيجة بنجاح' : '⚠ تعذّر الحفظ، بس نتيجتكم ظاهرة'; el.classList.add(d.ok ? 'ok' : 'bad'); } })
    .catch(() => { if (el) { el.textContent = '⚠ تعذّر الاتصال بالخادم'; el.classList.add('bad'); } });
}

/* ---------- router ---------- */
function render() {
  setProgress();
  if (state.step === 0) return renderInfo();
  if (state.step === 1) return renderConcern();
  if (state.step >= 2 && state.step < TOTAL_STEPS) return renderQuestion();
  return renderResult();
}

/* ---------- small view helpers ---------- */
function chip(v, sel) { return `<button class="chip ${sel ? 'sel' : ''}" data-v="${esc(v)}">${v}</button>`; }
function bindChips(id, cb) {
  document.querySelectorAll(`#${id} .chip`).forEach(c => {
    c.onclick = () => {
      document.querySelectorAll(`#${id} .chip`).forEach(x => x.classList.remove('sel'));
      c.classList.add('sel'); cb(c.dataset.v);
    };
  });
}
function showErr(el, msg) { el.textContent = msg; el.hidden = false; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function mascotSVG() {
  return `<svg class="mascot" viewBox="0 0 90 90" width="64" height="64" aria-hidden="true">
    <circle cx="45" cy="45" r="43" fill="#F3B7D3" opacity="0.35"/>
    <path d="M28 40c0-12 8-20 17-20s17 8 17 20c0 4-2 6-4 6-4 0-3-4-13-4s-9 4-13 4c-2 0-4-2-4-6z" fill="#fff" stroke="#6F4BAE" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="38" cy="42" r="2.4" fill="#6F4BAE"/><circle cx="52" cy="42" r="2.4" fill="#6F4BAE"/>
    <path d="M40 50c2 2 8 2 10 0" fill="none" stroke="#6F4BAE" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M45 12l2.2 4.6L52 19l-4.8 2.4L45 26l-2.2-4.6L38 19l4.8-2.4z" fill="#6F4BAE"/>
  </svg>`;
}

/* ---------- boot ---------- */
render();

</script>
