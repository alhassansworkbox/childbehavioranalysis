<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة التحكم — تحليل صحة الطفل</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
/* ================= Aladdin Child Analysis — RTL theme ================= */
:root{
  --purple:#6F4BAE; --purple-dark:#573a8c; --pink:#F3B7D3; --pink-deep:#e78bb6;
  --bg:#FFF8FC; --white:#fff; --ink:#3a2c53; --muted:#8b7fa3;
  --good:#2fae7a; --good-bg:#e7f7ef; --warn:#e8912f; --warn-bg:#fdf1e2;
  --risk:#d9587f; --risk-bg:#fdeaf1; --rec:#5a6bd6; --rec-bg:#eef0fd;
  --shadow:0 10px 30px rgba(111,75,174,.12); --shadow-sm:0 4px 14px rgba(111,75,174,.10);
  --radius:22px; --radius-sm:15px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  background:
    radial-gradient(circle at 12% 8%, #fbe6f1 0, transparent 42%),
    radial-gradient(circle at 88% 4%, #efe7fb 0, transparent 40%),
    var(--bg);
  color:var(--ink); direction:rtl; line-height:1.7;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.brand-name,.score-num{font-family:"Baloo Bhaijaan 2","Tajawal",sans-serif;font-weight:700}

/* ---------- shell ---------- */
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.topbar{display:flex;align-items:center;gap:12px;justify-content:center;padding:14px 6px 6px;text-align:center}
.logo-badge{display:flex;align-items:center;justify-content:center}
.brand-name{color:var(--purple);font-size:1.05rem;line-height:1.3;margin:0}
.brand-sub{color:var(--pink-deep);font-size:.72rem;letter-spacing:.5px;margin:0;font-weight:700}

.hero-title{text-align:center;margin:6px 0 14px}
.hero-title h1{font-size:1.5rem;color:var(--purple);margin:.2em 0 .1em}
.hero-title p{margin:0;color:var(--muted);font-size:.92rem}

/* ---------- progress ---------- */
#progressWrap{position:sticky;top:8px;z-index:5;margin:8px 2px 18px}
.progress-track{height:12px;background:#f0e6f6;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(111,75,174,.12)}
#progressFill{height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  transition:width .5s cubic-bezier(.4,1.3,.5,1)}
#progressText{display:block;text-align:center;font-size:.78rem;color:var(--muted);margin-top:6px;font-weight:700}

/* ---------- cards ---------- */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:22px 20px;margin-bottom:16px;border:1px solid #f3ebf8}
.step-title{font-size:1.28rem;color:var(--purple);margin:.1em 0 .8em;text-align:center}
.fade-in{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* mascot */
.mascot-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.hi-bubble{background:var(--pink);color:var(--purple-dark);font-weight:700;font-size:.9rem;
  padding:8px 14px;border-radius:16px 16px 16px 4px}

/* ---------- form fields ---------- */
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-weight:700;color:var(--purple-dark);margin-bottom:8px;font-size:.98rem}
.fld input{width:100%;padding:14px 16px;border:2px solid #eadcf4;border-radius:var(--radius-sm);
  font-family:inherit;font-size:1.05rem;background:#fdfaff;color:var(--ink);transition:border .2s,box-shadow .2s}
.fld input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px rgba(111,75,174,.12)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{flex:1 1 auto;min-width:44%;padding:12px 10px;border:2px solid #eadcf4;background:#fdfaff;
  border-radius:14px;font-family:inherit;font-size:1rem;color:var(--ink);cursor:pointer;transition:.18s;font-weight:600}
.chip:hover{border-color:var(--pink-deep)}
.chip.sel{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:var(--shadow-sm)}

/* ---------- buttons ---------- */
.btn-primary{width:100%;padding:16px;border:none;border-radius:16px;cursor:pointer;
  background:linear-gradient(90deg,var(--purple),var(--pink-deep));color:#fff;
  font-family:inherit;font-weight:700;font-size:1.1rem;margin-top:6px;box-shadow:var(--shadow);transition:transform .15s,filter .15s}
.btn-primary:hover{filter:brightness(1.05)}
.btn-primary:active{transform:scale(.98)}
.btn-back{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.95rem;
  cursor:pointer;padding:2px 4px;margin-bottom:6px;font-weight:700}
.btn-back:hover{color:var(--purple)}
.btn-ghost{width:100%;padding:13px;border:2px solid #eadcf4;background:#fff;border-radius:14px;
  color:var(--purple);font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;margin-top:12px}
.reassure,.save-state{text-align:center;color:var(--muted);font-size:.8rem;margin:12px 0 0}
.err{background:var(--risk-bg);color:var(--risk);padding:10px 14px;border-radius:12px;
  font-weight:700;font-size:.9rem;margin:6px 0 0}

/* ---------- concern grid ---------- */
.concern-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.concern{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;
  border:2px solid #eadcf4;background:#fdfaff;border-radius:18px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:.98rem;transition:.18s}
.concern:hover{border-color:var(--pink-deep);transform:translateY(-2px)}
.concern.sel{background:linear-gradient(160deg,#fff,#f7edfb);border-color:var(--purple);box-shadow:var(--shadow-sm)}
.concern .ce{font-size:1.9rem;line-height:1}
.concern:last-child:nth-child(odd){grid-column:1 / -1}

/* ---------- questions ---------- */
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-cat{background:var(--pink);color:var(--purple-dark);font-weight:700;font-size:.78rem;padding:5px 12px;border-radius:999px}
.q-num{color:var(--muted);font-size:.82rem;font-weight:700}
.q-text{font-size:1.3rem;color:var(--purple);margin:.1em 0 .9em;line-height:1.5}
.answers{display:flex;flex-direction:column;gap:11px}
.answer{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;text-align:right;
  border:2px solid #eadcf4;background:#fdfaff;border-radius:16px;cursor:pointer;
  font-family:inherit;font-size:1.08rem;color:var(--ink);font-weight:600;transition:.16s}
.answer .dot{width:20px;height:20px;border-radius:50%;border:2px solid #d9c6ea;flex:0 0 auto;transition:.16s}
.answer:hover{border-color:var(--pink-deep);transform:translateX(-3px)}
.answer.sel{background:var(--purple);border-color:var(--purple);color:#fff}
.answer.sel .dot{background:#fff;border-color:#fff;box-shadow:inset 0 0 0 4px var(--purple)}

/* ---------- result ---------- */
.result{animation:fade .5s ease}
.result-hero{border-radius:26px;padding:26px 20px;text-align:center;color:#fff;margin-bottom:16px;box-shadow:var(--shadow)}
.result-hero.t-good{background:linear-gradient(160deg,#34b98a,#2fae7a)}
.result-hero.t-mid{background:linear-gradient(160deg,#eaa93f,#e8912f)}
.result-hero.t-low{background:linear-gradient(160deg,#8a5cc0,#6F4BAE)}
.result-hero h2{margin:14px 0 6px;font-size:1.3rem}
.status-desc{margin:0;opacity:.95;font-size:.96rem}
.score-ring{width:118px;height:118px;border-radius:50%;margin:0 auto 10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.16);
  border:5px solid rgba(255,255,255,.55);animation:pop .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.score-num{font-size:2.5rem;line-height:1}
.score-den{font-size:.9rem;opacity:.85}
.status-badge{display:inline-block;background:rgba(255,255,255,.2);padding:6px 18px;border-radius:999px;font-weight:700;margin-top:4px}

.sec-title{color:var(--purple);font-size:1.12rem;margin:0 0 12px}
.bar-row{margin-bottom:14px}
.bar-top{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:6px;color:var(--purple-dark)}
.bar-track{height:14px;background:#f0e6f6;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transition:width .9s cubic-bezier(.4,1.2,.5,1)}
.bar-fill.t-good{background:linear-gradient(90deg,#7ad0aa,var(--good))}
.bar-fill.t-mid{background:linear-gradient(90deg,#f2c67e,var(--warn))}
.bar-fill.t-low{background:linear-gradient(90deg,var(--pink),var(--purple))}

.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.rlist li{padding:12px 14px;border-radius:13px;font-weight:600;font-size:.98rem;border-inline-start:5px solid}
.rlist.good li{background:var(--good-bg);border-color:var(--good)}
.rlist.warn li{background:var(--warn-bg);border-color:var(--warn)}
.rlist.risk li{background:var(--risk-bg);border-color:var(--risk)}
.rlist.rec li{background:var(--rec-bg);border-color:var(--rec)}
.muted{color:var(--muted)}

.card.focus{background:linear-gradient(160deg,#fff,#f7edfb);border:2px solid var(--purple)}
.focus-main{font-size:1.15rem;font-weight:700;color:var(--purple);margin:0 0 6px}
.focus-rec{margin:0;color:var(--ink)}

.plan{display:flex;flex-direction:column;gap:12px}
.plan-col{background:#fdfaff;border:2px solid #f0e6f6;border-radius:16px;padding:14px 16px}
.plan-col h4{margin:0 0 8px;color:var(--pink-deep);font-size:1rem}
.plan-col p{margin:5px 0;font-size:.96rem}

.card.tip{background:#fff9f2;border:2px solid #f6e2c8}
.card.message{background:linear-gradient(160deg,#f7edfb,#fdeaf1);border:none;text-align:center;font-size:1.05rem;font-weight:600;color:var(--purple-dark)}

/* ---------- CTA ---------- */
.cta{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;text-align:center;border:1px solid #f3ebf8}
.cta>p{margin:0 0 14px;font-weight:600}
.btn-whatsapp{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:16px;border-radius:16px;background:#25D366;color:#fff;text-decoration:none;
  font-weight:700;font-size:1.12rem;box-shadow:0 8px 20px rgba(37,211,102,.35);transition:transform .15s,filter .15s}
.btn-whatsapp:hover{filter:brightness(1.04)}
.btn-whatsapp:active{transform:scale(.98)}
.save-state.ok{color:var(--good)}.save-state.bad{color:var(--warn)}

/* ---------- footer ---------- */
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:22px;line-height:2}
.foot a{color:var(--purple);text-decoration:none;font-weight:700}

/* ---------- desktop niceties ---------- */
@media(min-width:600px){
  .plan{flex-direction:row}
  .plan-col{flex:1}
  .hero-title h1{font-size:1.8rem}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:8px}

</style>
  <style>
    .wrap{max-width:920px}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
    .stat{background:#fff;border-radius:18px;box-shadow:var(--shadow-sm);padding:18px;text-align:center;border:1px solid #f3ebf8}
    .stat .v{font-family:"Baloo Bhaijaan 2";font-size:2rem;color:var(--purple);line-height:1}
    .stat .l{color:var(--muted);font-size:.85rem;margin-top:6px;font-weight:700}
    .stat.alert .v{color:var(--risk)}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th,td{padding:10px 8px;text-align:right;border-bottom:1px solid #f0e6f6}
    th{color:var(--purple);font-size:.82rem}
    .pill{font-size:.75rem;padding:3px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
    .p-low{background:var(--risk-bg);color:var(--risk)}.p-mid{background:var(--warn-bg);color:var(--warn)}.p-good{background:var(--good-bg);color:var(--good)}
    .gate{max-width:420px;margin:40px auto}
    .tbl-wrap{overflow-x:auto}
    .row-actions{display:flex;gap:8px;margin:6px 0 16px}
    a.wa{color:#128C4B;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero-title" style="margin-top:16px">
      <h1>📊 لوحة تحكم تحليل صحة الطفل</h1>
      <p>البيانات تُسحب مباشرة من قاعدة بيانات Notion</p>
    </div>

    <div id="gate" class="card gate">
      <label class="fld"><span>كلمة مرور اللوحة</span>
        <input id="key" type="password" placeholder="ADMIN_KEY" /></label>
      <p class="err" id="gateErr" hidden></p>
      <button class="btn-primary" id="enter">دخول</button>
    </div>

    <div id="dash" hidden>
      <div class="row-actions">
        <button class="btn-ghost" id="refresh" style="width:auto;padding:8px 18px">↻ تحديث</button>
      </div>
      <div class="stat-grid" id="stats"></div>
      <div class="card">
        <h3 class="sec-title">📋 آخر التقييمات</h3>
        <div class="tbl-wrap"><table id="latest"><thead><tr>
          <th>الطفل</th><th>الهاتف</th><th>العمر</th><th>القلق</th><th>الدرجة</th><th>الحالة</th><th>التاريخ</th>
        </tr></thead><tbody></tbody></table></div>
      </div>
    </div>
  </div>
  <script>
'use strict';

const $ = (s) => document.querySelector(s);
const gate = $('#gate'), dash = $('#dash');
let adminKey = sessionStorage.getItem('adminKey') || '';

function statusPill(s) {
  const cls = s === 'بطل صحة' ? 'p-good' : s === 'على الطريق الصحيح' ? 'p-mid' : 'p-low';
  return `<span class="pill ${cls}">${s || '—'}</span>`;
}
function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleDateString('ar-IQ', { year: 'numeric', month: 'short', day: 'numeric' }); }
  catch { return iso.slice(0, 10); }
}
function waLink(phone) {
  if (!phone) return '—';
  const intl = '964' + String(phone).replace(/\D/g, '').replace(/^0/, '');
  return `<a class="wa" href="https://wa.me/${intl}" target="_blank" rel="noopener">${phone}</a>`;
}

async function loadStats() {
  const statsEl = $('#stats');
  statsEl.innerHTML = '<p class="muted">… جاري التحميل</p>';
  try {
    const r = await fetch('/api/admin/stats', { headers: { 'x-admin-key': adminKey } });
    if (r.status === 401) { logout('كلمة المرور غير صحيحة'); return; }
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'error');

    statsEl.innerHTML = `
      ${stat(d.totalAssessments, 'عدد التقييمات')}
      ${stat(d.averageTotal + '/120', 'متوسط الدرجات')}
      ${stat((d.topConcern.name || '—'), 'أكثر مشكلة متكررة', false, d.topConcern.count ? d.topConcern.count + ' حالة' : '')}
      ${stat(d.highRiskCount, 'أطفال عاليي الخطورة', true)}
      ${stat(d.followUpCount, 'حالات تحتاج متابعة', d.followUpCount > 0)}
      ${stat(d.averageOral + '/50', 'متوسط صحة الفم')}
      ${stat(d.averageNutrition + '/30', 'متوسط التغذية')}
      ${stat(d.averageActivity + '/20', 'متوسط النشاط')}
    `;

    const tb = $('#latest tbody');
    tb.innerHTML = (d.latest || []).map((x) => `
      <tr>
        <td>${esc(x.name)}${x.highRisk ? ' 🔴' : ''}</td>
        <td>${waLink(x.phone)}</td>
        <td>${esc(x.age) || '—'}</td>
        <td>${esc(x.concern) || '—'}</td>
        <td><strong>${x.total ?? '—'}</strong></td>
        <td>${statusPill(x.status)}</td>
        <td>${fmtDate(x.date)}</td>
      </tr>`).join('') || '<tr><td colspan="7" class="muted">لا توجد تقييمات بعد</td></tr>';
  } catch (e) {
    statsEl.innerHTML = `<p class="err" style="grid-column:1/-1">تعذّر جلب البيانات. تأكدوا من ضبط الخادم و Notion.</p>`;
  }
}

function stat(value, label, alert = false, sub = '') {
  return `<div class="stat ${alert ? 'alert' : ''}"><div class="v">${esc(String(value))}</div>
    <div class="l">${esc(label)}${sub ? ` · ${esc(sub)}` : ''}</div></div>`;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function showDash() { gate.hidden = true; dash.hidden = false; loadStats(); }
function logout(msg) {
  sessionStorage.removeItem('adminKey'); adminKey = '';
  gate.hidden = false; dash.hidden = true;
  if (msg) { const e = $('#gateErr'); e.textContent = msg; e.hidden = false; }
}

$('#enter').onclick = () => {
  adminKey = $('#key').value.trim();
  if (!adminKey) return;
  sessionStorage.setItem('adminKey', adminKey);
  $('#gateErr').hidden = true;
  showDash();
};
$('#key').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#enter').click(); });
$('#refresh').onclick = loadStats;

if (adminKey) showDash();

</script>
</body>
</html>
